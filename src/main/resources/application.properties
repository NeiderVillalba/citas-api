spring.application.name=citas-api
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:citas_fcv_training}
spring.datasource.username=${DB_USER:citas_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:3000}
app.auth.access-secret=${JWT_ACCESS_SECRET:}
app.auth.refresh-secret=${JWT_REFRESH_SECRET:}
app.auth.access-minutes=${JWT_ACCESS_MINUTES:15}
app.auth.refresh-days=${JWT_REFRESH_DAYS:7}
app.auth.cookie-secure=${JWT_REFRESH_COOKIE_SECURE:true}
app.demo-seed=${DEMO_SEED:false}
app.bootstrap.admin-email=${ADMIN_BOOTSTRAP_EMAIL:}
app.bootstrap.admin-password=${ADMIN_BOOTSTRAP_PASSWORD:}
